[package]
name = "ufunguo-api"
version = "0.1.0"
edition = "2024"
description = "Local regtest-only HTTP bridge between the Ufunguo mobile app and ufunguo-core"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
bitcoin = "0.32.102"
dotenvy = "0.15.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }
ufunguo-core = { version = "0.1.0", path = "../ufunguo-core" }
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1.9.0", features = ["serde"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
ufunguo-core = { version = "0.1.0", path = "../ufunguo-core", features = ["test-utils"] }
